name: Täglicher Datenabruf und Aktualisierung

on:
  schedule:
    - cron: "10 10 * * *"  # Täglich um 12:10 Uhr MEZ (10:10 UTC)
  workflow_dispatch:  # Ermöglicht manuelles Auslösen

jobs:
  fetch-and-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4.1.1  # Neueste Version

      - name: Set up Python
        uses: actions/setup-python@v5.1.0  # Neueste Version
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas

      - name: Run forecast_agent.py
        run: python forecast_agent.py

      - name: Run agent.py
        run: python agent.py

      - name: Commit and push changes
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add weather_data.db
          git commit -m "Täglicher Datenabruf: $(date +'%Y-%m-%d %H:%M')"
          git push
