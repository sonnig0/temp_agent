name: Täglicher Datenabruf

on:
  schedule:
    - cron: "37 19 * * *"
  workflow_dispatch:

permissions:
  contents: write   # ← WICHTIG

jobs:
  fetch-and-update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas

      - name: Run forecast_agent.py
        run: python forecast_agent.py

      - name: Run agent.py
        run: python agent.py

      - name: Commit and push changes
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add weather_data.db
          git commit -m "Automatischer Datenabruf: $(date +'%Y-%m-%d %H:%M')" || echo "Nichts zu committen"
          git push
